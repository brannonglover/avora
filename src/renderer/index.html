<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unnamed Browser</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="toolbar">
        <button class="icon-button" id="backButton" title="Back" aria-label="Back">
          <span aria-hidden="true">‹</span>
        </button>
        <button class="icon-button" id="forwardButton" title="Forward" aria-label="Forward">
          <span aria-hidden="true">›</span>
        </button>
        <button class="icon-button" id="reloadButton" title="Reload" aria-label="Reload">
          <span aria-hidden="true">↻</span>
        </button>
        <form class="address-form" id="addressForm">
          <input
            id="addressInput"
            type="text"
            autocomplete="off"
            spellcheck="false"
            aria-label="Address and search"
            placeholder="Search or enter address"
          />
        </form>
        <div class="extensions-tray" id="extensionsTray" aria-label="Extensions"></div>
        <button
          class="icon-button"
          id="extensionsButton"
          title="Load unpacked extension"
          aria-label="Load unpacked extension"
        >
          <span aria-hidden="true">◇</span>
        </button>
        <button class="icon-button" id="newTabTopButton" title="New tab" aria-label="New tab">
          <span aria-hidden="true">+</span>
        </button>
      </header>

      <aside class="tabs-panel" aria-label="Vertical tabs">
        <div class="tabs-title pinned-title">
          <span>Pinned</span>
          <button class="icon-button small" id="newTabButton" title="New tab" aria-label="New tab">
            <span aria-hidden="true">+</span>
          </button>
        </div>
        <ol class="pinned-tabs-list" id="pinnedTabsList"></ol>

        <div class="tabs-title tabs-title-regular">
          <span>Tabs</span>
        </div>
        <ol class="tabs-list" id="tabsList"></ol>
        <div
          class="sidebar-resizer"
          id="sidebarResizer"
          role="separator"
          aria-label="Resize sidebar"
          aria-orientation="vertical"
          aria-valuemin="184"
          aria-valuemax="360"
          aria-valuenow="236"
          tabindex="0"
          title="Drag to resize sidebar"
        ></div>
      </aside>

      <section class="content-well" aria-hidden="true"></section>
      <div class="download-stack" id="downloadStack" aria-live="polite"></div>
      <section class="new-tab-overlay" id="newTabOverlay" hidden>
        <form class="new-tab-card" id="newTabForm">
          <input
            class="new-tab-input"
            id="newTabInput"
            type="text"
            autocomplete="off"
            spellcheck="false"
            aria-label="Search or enter address for new tab"
            placeholder="Search or enter address"
          />
        </form>
      </section>
      <section class="extension-install-overlay" id="extensionInstallOverlay" hidden>
        <form class="extension-install-card" id="extensionInstallForm">
          <div class="extension-install-title">Install extension</div>
          <input
            class="extension-install-input"
            id="extensionInstallInput"
            type="text"
            autocomplete="off"
            spellcheck="false"
            aria-label="Chrome Web Store URL or extension ID"
            placeholder="Chrome Web Store URL, extension ID, or 1password"
          />
          <div class="extension-install-actions">
            <button class="secondary-button" id="loadUnpackedButton" type="button">Load unpacked</button>
            <button class="primary-button" type="submit">Install</button>
          </div>
        </form>
      </section>
    </main>

    <script src="./renderer.js"></script>
  </body>
</html>
